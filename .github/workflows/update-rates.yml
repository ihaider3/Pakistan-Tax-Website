name: Update gold & silver rates

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 12:00 PKT, once daily
  workflow_dispatch:      # manual "Run workflow" button in GitHub Actions

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update gold and silver rates
        run: node scripts/update-rates.mjs

      - name: Commit if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add src/data/rates.json public/data/rates.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update gold/silver rates $(date -u +%F)"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (remote main updated); resetting, pulling latest main, and refreshing rates (attempt $attempt/3)..."
              git reset --hard HEAD~1
              git pull --ff-only origin main
              node scripts/update-rates.mjs
              git add src/data/rates.json public/data/rates.json
              if git diff --cached --quiet; then
                echo "No rate changes after pull."
                exit 0
              fi
              git commit -m "chore: update gold/silver rates $(date -u +%F)"
            done
            git push
          fi
